; PlatformIO configuration for 1-Wheel Balance Cube (ESP32 DevKit V1)
; Supports: pio run / pio run -t upload / pio device monitor

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = espidf
monitor_speed = 115200

build_flags =
    -Iinclude
    -Ibalance_controller_c
    -std=gnu99
    -O2
    -Wall
    -Wextra

board_build.cmake_extra_args =
    -DEXTRA_COMPONENT_DIRS=${PROJECT_DIR}/balance_controller_c
